# Homepage reachability and basic render.
#
# The cheapest probe there is: no browser, just "does the front door answer".
# Runs often because it is nearly free.

[probe]
id = "homepage"
name = "Homepage responds"
component = "website"
severity = "critical"
runner = "http"
url = "/"
method = "GET"
timeout_ms = 15000

[probe.schedule]
type = "interval"
value = "300"

[probe.retry]
attempts = 2
confirm_runs = 2
backoff_seconds = 15

[probe.assertions]
max_http_status = 399
max_duration_seconds = 5.0

[[probe.expect]]
kind = "status"
matches = "200"
